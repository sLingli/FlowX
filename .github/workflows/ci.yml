name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-and-test:
    name: Windows Rust Build & Test
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Clippy linter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: CLI offline smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-LastExitCode([string]$Step) {
            if ($LASTEXITCODE -ne 0) {
              throw "$Step failed with exit code $LASTEXITCODE"
            }
          }

          .\target\release\flowx.exe --version
          Assert-LastExitCode "flowx --version"

          .\target\release\flowx.exe --help | Out-Null
          Assert-LastExitCode "flowx --help"

          $statusJson = .\target\release\flowx.exe --config flowx.example.xml --offline status --json
          Assert-LastExitCode "flowx status --json"
          $status = $statusJson | ConvertFrom-Json
          if ($status.mode -ne 'offline') { throw "Unexpected status mode: $($status.mode)" }

          $simJson = .\target\release\flowx.exe --config flowx.example.xml --offline sim --app git.exe --target api.github.com:443 --json
          Assert-LastExitCode "flowx sim --json"
          $sim = $simJson | ConvertFrom-Json
          if ($sim.action -notmatch 'Proxy') { throw "Unexpected sim action: $($sim.action)" }

          $docJson = .\target\release\flowx.exe --config flowx.example.xml --offline transparent doctor --json
          Assert-LastExitCode "flowx transparent doctor --json"
          $null = $docJson | ConvertFrom-Json

  validate-skill:
    name: Validate AI Agent Skill
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate skills/flowx structure and frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          skill_dir = pathlib.Path("skills/flowx")
          skill_md = skill_dir / "SKILL.md"
          raw = skill_md.read_bytes()
          if b"\r\n" in raw:
              sys.exit("SKILL.md must use LF line endings (found CRLF)")

          text = raw.decode("utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          if not m:
              sys.exit("SKILL.md is missing valid LF YAML frontmatter")

          fields = {}
          for line in m.group(1).splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if ":" not in line:
                  sys.exit(f"Invalid frontmatter line: {line}")
              k, v = line.split(":", 1)
              fields[k.strip()] = v.strip().strip('"').strip("'")

          allowed = {"name", "description", "license", "allowed-tools", "metadata"}
          extra = set(fields) - allowed
          if extra:
              sys.exit(f"Unexpected frontmatter keys: {sorted(extra)}")
          if fields.get("name") != "flowx":
              sys.exit(f"Expected name 'flowx', got {fields.get('name')!r}")
          desc = fields.get("description", "")
          if not desc or len(desc) > 1024 or "<" in desc or ">" in desc:
              sys.exit("Invalid SKILL.md description")

          required_files = [
              skill_dir / "references" / "api-and-auth-semantics.md",
              skill_dir / "references" / "flowx.example.xml",
              skill_dir / "agents" / "openai.yaml",
          ]
          for req in required_files:
              if not req.is_file():
                  sys.exit(f"Missing required skill file: {req}")

          openai_yaml = (skill_dir / "agents" / "openai.yaml").read_text(encoding="utf-8")
          for key in ("display_name:", "short_description:", "default_prompt:"):
              if key not in openai_yaml:
                  sys.exit(f"Missing {key} in agents/openai.yaml")

          print("Skill validation passed cleanly.")
          PY

      - name: Smoke test @slingli/flowx-skill package
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run npm pack dry-run & installer check
        working-directory: packages/flowx-skill
        run: |
          set -euo pipefail
          npm pack --dry-run
          node ./bin/install.js --dir /tmp/flowx-ci-skill
          test -f /tmp/flowx-ci-skill/flowx/SKILL.md
          rm -rf /tmp/flowx-ci-skill
