name: Release Skill

on:
  push:
    tags:
      - "skill-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-skill:
    name: Validate, Package & Publish @slingli/flowx-skill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate Skill version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_ver="$(node -p "require('./packages/flowx-skill/package.json').version")"
          if [ "$REF_TYPE" = "tag" ]; then
            ver="${REF_NAME#skill-v}"
            if [ "$ver" != "$pkg_ver" ]; then
              echo "Error: Tag '$REF_NAME' ($ver) does not match packages/flowx-skill/package.json version '$pkg_ver'"
              exit 1
            fi
            release_ver="$ver"
            if [[ "$ver" == *-* ]]; then
              is_pre="true"
            else
              is_pre="false"
            fi
          else
            release_ver="${pkg_ver}-ci.${GITHUB_RUN_NUMBER}"
            is_pre="true"
          fi
          echo "VERSION=${release_ver}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${is_pre}" >> "$GITHUB_ENV"
          echo "Packaging @slingli/flowx-skill version ${release_ver} (prerelease=${is_pre})"

      - name: Validate skills/flowx structure and frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          skill_dir = pathlib.Path("skills/flowx")
          skill_md = skill_dir / "SKILL.md"
          raw = skill_md.read_bytes()
          if b"\r\n" in raw:
              sys.exit("SKILL.md must use LF line endings (found CRLF)")

          text = raw.decode("utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          if not m:
              sys.exit("SKILL.md is missing valid LF YAML frontmatter")

          fields = {}
          for line in m.group(1).splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if ":" not in line:
                  sys.exit(f"Invalid frontmatter line: {line}")
              k, v = line.split(":", 1)
              fields[k.strip()] = v.strip().strip('"').strip("'")

          allowed = {"name", "description", "license", "allowed-tools", "metadata"}
          extra = set(fields) - allowed
          if extra:
              sys.exit(f"Unexpected frontmatter keys: {sorted(extra)}")
          if fields.get("name") != "flowx":
              sys.exit(f"Expected name 'flowx', got {fields.get('name')!r}")
          desc = fields.get("description", "")
          if not desc or len(desc) > 1024 or "<" in desc or ">" in desc:
              sys.exit("Invalid SKILL.md description")

          for req in (
              skill_dir / "references" / "api-and-auth-semantics.md",
              skill_dir / "references" / "flowx.example.xml",
              skill_dir / "agents" / "openai.yaml",
          ):
              if not req.is_file():
                  sys.exit(f"Missing required skill file: {req}")

          print("Skill validation passed cleanly.")
          PY

      - name: Setup Node.js 24 (npm >= 11.5.1 for Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync, test installer & assemble standalone archive
        run: |
          set -euo pipefail
          npm --version
          (
            cd packages/flowx-skill
            npm pack --dry-run
            node ./bin/install.js --help
            node ./bin/install.js --dir /tmp/flowx-skill-smoke
            test -f /tmp/flowx-skill-smoke/flowx/SKILL.md
            rm -rf /tmp/flowx-skill-smoke
          )
          mkdir -p dist /tmp/skill-stage
          cp -R skills /tmp/skill-stage/skills
          cp LICENSE /tmp/skill-stage/LICENSE
          (cd /tmp/skill-stage && zip -r "${GITHUB_WORKSPACE}/dist/flowx-skill-${VERSION}.zip" .)
          (cd dist && sha256sum "flowx-skill-${VERSION}.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowx-skill-release-${{ env.VERSION }}
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release for Skill
        if: startsWith(github.ref, 'refs/tags/skill-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FlowX Skill v${{ env.VERSION }}"
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish @slingli/flowx-skill to npm via Trusted Publishing (OIDC)
        if: startsWith(github.ref, 'refs/tags/skill-v')
        working-directory: packages/flowx-skill
        run: |
          set -euo pipefail
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
