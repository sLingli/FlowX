[package]
name = "flowx"
version = "0.1.0"
edition = "2024"
description = "FlowX - Modern Transparent Proxy & Process Routing Engine"

[dependencies]
# 异步运行时与网络 I/O
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"

# 错误处理与日志诊断
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# 配置解析与模型序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }

# 路由与规则匹配支持
ipnet = "2.9"
glob = "0.3"

# 透明代理协议栈与报文解析（纯 Rust 无 C 构建依赖）
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
etherparse = "0.21.0"

# Windows 原生网络/进程 API 交互（仅在 Windows 目标平台编译）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
